<style>
/* Layout: full-bleed 3D view; one compact control rail top-left, hint strip bottom, touch pads on phones. */
:root {
  --bg: #e9ecea;            /* sky-ish ground behind the canvas */
  --panel: rgba(250, 251, 249, 0.92);
  --ink: #1c2421;
  --muted: #5d6a65;
  --line: rgba(28, 36, 33, 0.14);
  --accent: #2f6f5e;        /* cedar green */
  --accent-ink: #ffffff;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101513; --panel: rgba(22, 29, 26, 0.9); --ink: #e6ece9; --muted: #9aa8a2;
    --line: rgba(230, 236, 233, 0.16); --accent: #6fbca4; --accent-ink: #0d1412; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101513; --panel: rgba(22, 29, 26, 0.9); --ink: #e6ece9; --muted: #9aa8a2;
  --line: rgba(230, 236, 233, 0.16); --accent: #6fbca4; --accent-ink: #0d1412; color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--display); overflow: hidden; }
#view { position: fixed; inset: 0; }
#view canvas { display: block; width: 100%; height: 100%; touch-action: none; }

.rail {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + 16px); left: 16px;
  width: min(300px, calc(100vw - 32px)); display: grid; gap: 10px;
  padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  backdrop-filter: blur(6px); z-index: 2;
}
.rail h1 { margin: 0; font-size: 1.15rem; font-weight: 700; letter-spacing: 0.01em; text-wrap: balance; }
.rail .sub { margin: 0; font-family: var(--mono); font-size: 0.72rem; color: var(--muted); letter-spacing: 0.02em; }
.rail label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.rail select, .rail button {
  font: 500 0.88rem var(--display); color: var(--ink); background: transparent;
  border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; width: 100%;
}
.rail select:focus-visible, .rail button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: flex; gap: 8px; }
.row button { flex: 1; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.readout { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.rail.collapsed .more { display: none; }
.toggle { justify-self: start; padding: 4px 8px !important; width: auto !important; font-size: 0.75rem !important; }

.hint {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); max-width: calc(100vw - 32px);
  padding: 8px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
  font-size: 0.8rem; color: var(--ink); text-align: center; z-index: 2;
}
.hint kbd { font-family: var(--mono); font-size: 0.74rem; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.cross { position: fixed; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px;
  border: 1.5px solid rgba(255,255,255,0.8); border-radius: 50%; mix-blend-mode: difference; pointer-events: none; z-index: 1; }

/* welcome window: how to move, shown while the model loads; Start closes it */
.loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 3; background: var(--bg);
  padding: 16px; overflow-y: auto; }
.intro { width: min(440px, 100%); display: grid; gap: 18px; padding: 24px; background: var(--panel);
  border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,0.12); }
.intro h2 { margin: 0; font-size: 1.3rem; font-weight: 700; text-wrap: balance; }
.intro .sub { margin: -10px 0 0; font-family: var(--mono); font-size: 0.75rem; color: var(--muted); }
.howto { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.howto li { display: grid; grid-template-columns: 92px 1fr; gap: 14px; align-items: center; font-size: 0.92rem; line-height: 1.4; }
.howto .ico { display: grid; justify-items: center; color: var(--ink); }
.arrows { display: grid; grid-template-columns: repeat(3, 26px); grid-template-rows: repeat(2, 26px); gap: 3px; }
.arrows kbd:nth-child(1) { grid-area: 1 / 2; } .arrows kbd:nth-child(2) { grid-area: 2 / 1; }
.arrows kbd:nth-child(3) { grid-area: 2 / 2; } .arrows kbd:nth-child(4) { grid-area: 2 / 3; }
.intro kbd { display: grid; place-items: center; min-width: 26px; height: 26px; padding: 0 6px; box-sizing: border-box;
  font: 500 0.78rem var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; background: var(--bg); }
.howto .small kbd { display: inline-grid; height: 22px; }
.touch .desk, body:not(.touch) .tch { display: none; }
.choice { margin: 0; padding: 0; border: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.choice legend, .startat label { padding: 0; margin-bottom: 6px; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.choice label { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font-size: 0.92rem; }
.choice label:has(input:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.choice input { accent-color: var(--accent); margin: 0; }
.startat { display: grid; }
.startat select { font: 500 0.9rem var(--display); color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 7px; padding: 9px 10px; }
.intro .status { margin: 0; font-family: var(--mono); font-size: 0.8rem; color: var(--muted); }
.intro button { font: 600 0.95rem var(--display); padding: 11px 14px; border-radius: 8px; border: 1px solid var(--accent); cursor: pointer; }
.intro button:disabled { opacity: 0.45; cursor: progress; }
.intro button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* touch: left pad moves, right side looks */
.pad { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 64px); left: 24px; width: 120px; height: 120px;
  border-radius: 50%; border: 1.5px solid var(--line); background: var(--panel); z-index: 2; touch-action: none; display: none; }
.pad .knob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px;
  border-radius: 50%; background: var(--accent); opacity: 0.85; }
body.touch .pad { display: block; }
body.touch .cross { display: none; }
@media (max-width: 520px) { .rail { padding: 10px 12px; } .rail h1 { font-size: 1rem; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

  Asphalt: () => tiles({ w: 2, h: 2, joint: 0, base: [0.08, 0.08, 0.085], grainAmt: 0.12 }),
  Granite_Speckled_Grey: () => tiles({ w: 0.5, h: 0.5, joint: 0, base: [0.32, 0.32, 0.33], grainAmt: 0.35 }),
  Cedar_Blue_Grey: () => tiles({ w: 1.5, h: 1.5, joint: 0, base: [0.10, 0.16, 0.18], grainAmt: 0.35 }),
};
const cache = {};
function fixMaterial(m) {
  if (MATS[m.name]) {
    cache[m.name] ??= MATS[m.name]();
    m.map = cache[m.name]; m.color.set(0xffffff); m.needsUpdate = true;
  }
  if (m.name === "Glass_Clear") { m.transparent = true; m.opacity = 0.18; m.depthWrite = false; m.transmission = 0; }
  if (m.name === "Parcel_Limit") m.visible = true;
  m.side = THREE.DoubleSide;
}

// ---- load ----
const colliders = [];
const loadMsg = document.getElementById("loadmsg");
// the model ships as a base64 script (house-model.js) because artifacts don't serve .glb files
function loadModel() {
  const s = document.createElement("script");
  s.src = "house-model.js?v=202610062120";   // stamp = house.glb export time, so browsers never reuse an old model
  s.onload = () => {
    const bin = atob(window.HOUSE_GLB_B64), buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    new GLTFLoader().parse(buf.buffer, "", gltf => { try { onModel(gltf); } catch (err) {
      console.error(err); loadMsg.textContent = T.errOpen + err.message; } },
      err => { console.error(err); loadMsg.textContent = T.errRead; });
  };
  s.onerror = () => { loadMsg.textContent = T.errLoad; };
  document.head.appendChild(s);
}
loadModel();
function onModel(gltf) {
  scene.add(gltf.scene);
  gltf.scene.traverse(o => {
    if (!o.isMesh) return;
    (Array.isArray(o.material) ? o.material : [o.material]).forEach(fixMaterial);
    const n = o.name;
    const transparent = /Glass|Window_Glass|Glazing/.test(n) || (o.material && o.material.name === "Glass_Clear");
    if (!/Parcel_Limit|_Light$|Crown|Screen$/.test(n) && !transparent) {
      o.geometry.computeBoundsTree(); colliders.push(o);
    }
  });
  goTo(+startRoom.value || 0);
  loadMsg.textContent = T.ready;
  startBtn.disabled = false;
  startBtn.focus();
}
const startBtn = document.getElementById("start");
const startRoom = document.getElementById("startRoom");
ROOMS.forEach(([label], i) => startRoom.add(new Option(T.rooms[i] || label, i)));
document.querySelectorAll('input[name="drink"]').forEach(r => {
  r.checked = r.value === drink;
  r.addEventListener("change", () => { drink = r.value; setDrink(drink); try { localStorage.setItem("kz9-drink", drink); } catch (e) {} });
});
startBtn.addEventListener("click", () => {
  goTo(+startRoom.value);
  document.getElementById("loading").hidden = true;
  if (!matchMedia("(pointer: coarse)").matches) renderer.domElement.requestPointerLock?.()?.catch?.(() => {});
});

// ---- player ----
const pos = new THREE.Vector3(), vel = new THREE.Vector3();
let yaw = 0, pitch = 0, flying = false, vy = 0;
const keys = {};
const sel = document.getElementById("room");
ROOMS.forEach(([label], i) => sel.add(new Option(T.rooms[i] || label, i)));
sel.addEventListener("change", () => goTo(+sel.value));
function goTo(i) {
  const [, p, a] = ROOMS[i];
  pos.set(p[0], p[1], p[2]); vy = 0;
  const dx = Math.cos(a), dz = -Math.sin(a);
  yaw = Math.atan2(-dx, -dz); pitch = -0.05;
  sel.value = i;
}
const ray = new THREE.Raycaster(); ray.firstHitOnly = true;
const DOWN = new THREE.Vector3(0, -1, 0);
function groundBelow(p, from = EYE) {
  ray.set(new THREE.Vector3(p.x, p.y - from + STEP + 0.05, p.z), DOWN); ray.far = 6;
  const h = ray.intersectObjects(colliders, false)[0];
  return h ? h.point.y : null;
}
function blocked(p, dir, dist) {
  for (const hgt of [STEP + 0.04, 0.9, 1.6]) {   // just above a stair riser, so beds / tables block
    ray.set(new THREE.Vector3(p.x, p.y - EYE + hgt, p.z), dir); ray.far = dist + RADIUS;
    if (ray.intersectObjects(colliders, false).length) return true;
  }
  return false;
}
function step(dt) {
  const fwd = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw)), right = new THREE.Vector3(-fwd.z, 0, fwd.x);
  const mv = new THREE.Vector3();
  if (keys.KeyW || keys.ArrowUp) mv.add(fwd);
  if (keys.KeyS || keys.ArrowDown) mv.sub(fwd);
  if (keys.KeyD || keys.ArrowRight) mv.add(right);
  if (keys.KeyA || keys.ArrowLeft) mv.sub(right);
  mv.x += touchMove.x * right.x + touchMove.y * fwd.x;
  mv.z += touchMove.x * right.z + touchMove.y * fwd.z;
  const speed = (keys.ShiftLeft || keys.ShiftRight ? RUN : WALK) * (flying ? 2.5 : 1);
  if (mv.lengthSq() > 1) mv.normalize();
  mv.multiplyScalar(speed * dt);
  if (flying) {
    if (keys.KeyE || keys.Space) mv.y += speed * dt;
    if (keys.KeyQ || keys.KeyC) mv.y -= speed * dt;
    pos.add(mv);
    return;
  }
  // slide along walls: try full move, then each axis
  for (const m of [mv, new THREE.Vector3(mv.x, 0, 0), new THREE.Vector3(0, 0, mv.z)]) {
    const d = m.length(); if (d < 1e-5) continue;
    if (!blocked(pos, m.clone().normalize(), d)) { pos.add(m); break; }
  }
  const g = groundBelow(pos);
  if (g !== null && pos.y - EYE - g < 0.05 && pos.y - EYE - g > -STEP - 0.05) {
    pos.y += (g + EYE - pos.y) * Math.min(1, dt * 14); vy = 0;          // on the ground / climbing a step
  } else {
    vy -= 9.81 * dt; pos.y += vy * dt;
    if (g !== null && pos.y - EYE < g) { pos.y = g + EYE; vy = 0; }
    if (pos.y < -20) goTo(0);
  }
}

// ---- input: pointer lock + keys (desktop), joystick + drag (touch) ----
const canvas = renderer.domElement;
const walkBtn = document.getElementById("walk");
walkBtn.addEventListener("click", () => { canvas.requestPointerLock?.()?.catch?.(() => {}); });
canvas.addEventListener("click", () => { if (!matchMedia("(pointer: coarse)").matches) canvas.requestPointerLock?.()?.catch?.(() => {}); });
document.addEventListener("pointerlockchange", () => {
  const on = document.pointerLockElement === canvas;
  walkBtn.textContent = on ? T.walking : T.walk;
  document.getElementById("hint").hidden = on;
});
document.addEventListener("mousemove", e => {
  if (document.pointerLockElement !== canvas) return;
  yaw -= e.movementX * 0.0022; pitch -= e.movementY * 0.0022;
  pitch = Math.max(-1.45, Math.min(1.45, pitch));
});
addEventListener("keydown", e => { if (e.target.tagName === "SELECT") return; keys[e.code] = true; if (e.code === "KeyF") toggleFly(); });
addEventListener("keyup", e => { keys[e.code] = false; });
addEventListener("blur", () => { for (const k in keys) keys[k] = false; });

const flyBtn = document.getElementById("fly");
function toggleFly() { flying = !flying; vy = 0; flyBtn.setAttribute("aria-pressed", String(flying)); }
flyBtn.addEventListener("click", toggleFly);
const rail = document.getElementById("rail"), coll = document.getElementById("collapse");
coll.addEventListener("click", () => {
  const c = rail.classList.toggle("collapsed");
  coll.textContent = c ? T.menu : T.hide; coll.setAttribute("aria-expanded", String(!c));
});

const touchMove = { x: 0, y: 0 };
if (matchMedia("(pointer: coarse)").matches) {
  document.body.classList.add("touch");
  document.getElementById("hint").innerHTML = T.touch;
  const pad = document.getElementById("pad"), knob = document.getElementById("knob");
  let padId = null;
  pad.addEventListener("pointerdown", e => { padId = e.pointerId; pad.setPointerCapture(e.pointerId); movePad(e); });
  pad.addEventListener("pointermove", e => { if (e.pointerId === padId) movePad(e); });
  const endPad = () => { padId = null; touchMove.x = touchMove.y = 0; knob.style.transform = ""; };
  pad.addEventListener("pointerup", endPad); pad.addEventListener("pointercancel", endPad);
  function movePad(e) {
    const r = pad.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const R = r.width / 2, l = Math.min(R, Math.hypot(dx, dy)), a = Math.atan2(dy, dx);
    knob.style.transform = `translate(${l * Math.cos(a)}px, ${l * Math.sin(a)}px)`;
    touchMove.x = (l / R) * Math.cos(a); touchMove.y = -(l / R) * Math.sin(a);
  }
  let lookId = null, lx = 0, ly = 0;
  canvas.addEventListener("pointerdown", e => { lookId = e.pointerId; lx = e.clientX; ly = e.clientY; });
  canvas.addEventListener("pointermove", e => {
    if (e.pointerId !== lookId) return;
    yaw -= (e.clientX - lx) * 0.005; pitch -= (e.clientY - ly) * 0.005;
    pitch = Math.max(-1.45, Math.min(1.45, pitch)); lx = e.clientX; ly = e.clientY;
  });
  canvas.addEventListener("pointerup", () => { lookId = null; });
}

// ---- loop ----
function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = armsCam.aspect = w / h; camera.updateProjectionMatrix(); armsCam.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();
const readout = document.getElementById("readout");
let last = performance.now(), acc = 0;
renderer.setAnimationLoop(t => {
  const dt = Math.min(0.05, (t - last) / 1000); last = t;
  const before = pos.clone();
  if (colliders.length) step(dt);
  camera.position.copy(pos); camera.rotation.set(pitch, yaw, 0);
  // arms sway with the walking pace and follow the head a little when looking up / down
  const pace = Math.hypot(pos.x - before.x, pos.z - before.z) / Math.max(dt, 1e-3);
  bob += dt * (pace > 0.2 ? 2.2 + pace * 1.6 : 0);
  const amp = Math.min(1, pace / 2);
  arms.position.set(Math.sin(bob) * 0.012 * amp, -Math.abs(Math.cos(bob)) * 0.014 * amp, 0);
  arms.rotation.x = -pitch * 0.12;
  arms.visible = !flying;
  renderer.autoClear = true;
  renderer.render(scene, camera);
  renderer.autoClear = false; renderer.clearDepth();
  renderer.render(armsScene, armsCam);
  if ((acc += dt) > 0.25) {
    acc = 0;
    const floor = pos.y - EYE;
    readout.textContent = `${flying ? T.flying : floor > 2.0 ? T.up : floor > -0.5 ? T.ground : T.out} · ${T.floor} ${floor.toFixed(2)} m · ${(457.92 + floor).toFixed(2)} ${T.asl}`;
  }
});
</script>
